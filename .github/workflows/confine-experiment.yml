# TEMPORARY (D2 measurement): runs scripts/confine-experiment.cjs on Windows with the pinned
# engines. Removed once the confinement policy is fixed and covered by the regular CI job.
name: Confinement experiment (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: confine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - uses: actions/cache/restore@v4
        with:
          path: .cache/engines
          key: engines-${{ hashFiles('scripts/engines.lock.json') }}
      - run: node scripts/fetch-engines.cjs --require-pinned
      - name: Build the confinement helper (MSVC)
        run: node native/confine/build.cjs
      - name: FAT32 and exFAT volumes
        shell: pwsh
        run: |
          foreach ($fs in @(@{n='fat32'; l='R'}, @{n='exfat'; l='S'})) {
            $vhd = Join-Path $env:RUNNER_TEMP "$($fs.n).vhdx"
            $script = "create vdisk file=`"$vhd`" maximum=512 type=expandable`nattach vdisk`ncreate partition primary`nformat fs=$($fs.n) quick label=MORPH`nassign letter=$($fs.l)`n"
            $dp = Join-Path $env:RUNNER_TEMP "dp-$($fs.n).txt"
            Set-Content -Path $dp -Value $script -Encoding ascii
            diskpart /s $dp | Out-Null
          }
          "MORPH_TEST_FAT32=R:\" >> $env:GITHUB_ENV
          "MORPH_TEST_EXFAT=S:\" >> $env:GITHUB_ENV
      - name: Measure
        run: node scripts/confine-experiment.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: confine-experiment
          path: |
            confine-experiment.json
            native/out/morph-confine.json
